name: Cashbarber - Automated Scheduler

on:
  workflow_dispatch:      # allows manual execution from GitHub

jobs:
  schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests

      - name: Run scheduler
        env:
          CASHBARBER_EMAIL: ${{ secrets.CASHBARBER_EMAIL }}
          CASHBARBER_PASSWORD: ${{ secrets.CASHBARBER_PASSWORD }}
          CASHBARBER_TENANT: ${{ secrets.CASHBARBER_TENANT }}
          CASHBARBER_BRANCH_ID: ${{ secrets.CASHBARBER_BRANCH_ID }}
          CASHBARBER_BARBER_NAME: ${{ secrets.CASHBARBER_BARBER_NAME }}
          CASHBARBER_SERVICES: ${{ secrets.CASHBARBER_SERVICES }}
          CASHBARBER_START_TIME: ${{ secrets.CASHBARBER_START_TIME }}
          CASHBARBER_END_TIME: ${{ secrets.CASHBARBER_END_TIME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/agendar.py